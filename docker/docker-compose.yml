# 启动： docker compose up -d
# 停止： docker compose down          （保留数据）
# 清库： docker compose down -v       （连同数据卷一起删除，慎用）

name: know-engine

services:

  # ---------------------------------------------------------------
  # MySQL 8
  # ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: know-engine-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: know_engine
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql-data:/var/lib/mysql
      - ./sql/know_engine.sql:/docker-entrypoint-initdb.d/01-know_engine.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - know-engine

  # ---------------------------------------------------------------
  # Redis —— Spring Data Redis(Lettuce) + Redisson 分布式锁
  # ---------------------------------------------------------------
  redis:
    image: redis:6.2
    container_name: know-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - know-engine

  # ---------------------------------------------------------------
  # MinIO —— 对象存储（原始文档 / 转换后 Markdown / 图片）
  #
  # 端口刻意这样映射，以对齐 application.yml:106-111 的既有写法：
  #   S3 API   宿主 9090 -> 容器 9000   （minio.url / minio.endpoint）
  # ---------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: know-engine-minio
    restart: unless-stopped
    ports:
      - "9090:9000"   # S3 API
      - "9000:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin       # application.yml:108
      MINIO_ROOT_PASSWORD: minioadmin   # application.yml:109
      TZ: Asia/Shanghai
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - ./data/minio-data:/data
    networks:
      - know-engine

  # ---------------------------------------------------------------
  # Elasticsearch 8.18.6 —— 向量库 / RAG 检索（索引 know-engine-vector 自动创建）
  # 必须 >= 8.18：langchain4j 1.11.0-beta19 的 ElasticsearchConfigurationKnn
  # 把 knn 放在 query 子句里，8.18 以下的服务端会报
  # "[knn] queries cannot be provided directly, use the [knn] body parameter instead"
  # 版本与 classpath 上的 elasticsearch-java 8.18.6 保持一致
  # ---------------------------------------------------------------
  elasticsearch:
    # 华为云镜像源只同步到 8.11.3，没有 8.18.6，故改用 Elastic 官方源。
    # 若该源拉取慢，可自行替换为带 8.18.6 的加速源。
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.6
    container_name: know-engine-es
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      # 项目用明文 HTTP 无认证连接（ElasticSearchConfiguration.java:36-38），
      # ES 8.x 默认开启安全模块，这里必须显式关闭，否则应用连不上
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # 关闭 GeoIP 库下载，避免启动时依赖外网、拖慢启动
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"   # 内存吃紧可下调为 -Xms512m -Xmx512m
      # 若容器启动报 "Unable to lock JVM Memory"，把下面这行改成 "false"
      bootstrap.memory_lock: "true"
      TZ: Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - know-engine

volumes:
  mysql-data:
  redis-data:
  minio-data:
  es-data:

networks:
  know-engine:
    driver: bridge
